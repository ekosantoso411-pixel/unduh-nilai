<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Nilai PP TKA_TKAD</title>
    <style>
        /* Gaya Tampilan Dasar */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2, h3 { text-align: center; color: #2c3e50; }
        
        /* Area Pencarian */
        .search-box { display: flex; justify-content: center; margin-bottom: 20px; gap: 10px; flex-wrap: wrap; }
        .search-box input { padding: 12px; font-size: 16px; border: 1px solid #ccd1d9; border-radius: 5px; width: 250px; max-width: 100%; outline: none; transition: 0.3s;}
        .search-box input:focus { border-color: #3498db; box-shadow: 0 0 5px rgba(52, 152, 219, 0.3); }
        .search-box button { padding: 12px 25px; font-size: 16px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .search-box button:hover { background: #2980b9; }

        /* Kotak Pesan (Pengganti Alert) */
        #message-box {
            display: none;
            padding: 12px 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            text-align: center;
            font-weight: 500;
        }
        .msg-error { background-color: #fdecea; color: #e74c3c; border: 1px solid #fadbd8; }
        .msg-warning { background-color: #fef9e7; color: #f39c12; border: 1px solid #fdebd0; }

        /* Status Loading */
        #loading { text-align: center; display: none; color: #e67e22; font-weight: bold; margin-bottom: 15px; font-size: 16px; }

        /* Area Hasil & Tabel */
        .result-section { display: none; margin-top: 30px; border-top: 2px dashed #ccd1d9; padding-top: 20px; }
        
        /* Desain Data Siswa (Diperbaiki Menggunakan CSS Grid agar Sejajar) */
        .student-info { 
            display: grid; 
            grid-template-columns: 160px 15px 1fr; /* Proporsi: Label, Titik Dua, Value */
            gap: 8px 0; /* Jarak antar baris */
            margin-bottom: 25px; 
            font-size: 16px; 
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #e1e8ed;
        }
        .student-info .label { font-weight: bold; color: #2c3e50; }
        .student-info .colon { text-align: center; font-weight: bold; color: #2c3e50; }
        .student-info .value { color: #333; font-weight: 500; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 25px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #2c3e50; color: white; text-transform: uppercase; font-size: 14px; }
        tbody tr:nth-child(even) { background-color: #f9f9f9; }
        
        /* Tombol Cetak */
        .btn-print { display: block; width: 100%; padding: 15px; background: #27ae60; color: white; text-align: center; font-size: 18px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .btn-print:hover { background: #2ecc71; }

        /* Pengaturan Khusus untuk Mobile Layout */
        @media (max-width: 500px) {
            .student-info { grid-template-columns: 120px 10px 1fr; font-size: 14px; padding: 12px; }
            th, td { font-size: 13px; padding: 8px; }
        }

        /* Pengaturan Khusus untuk PDF / Print */
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; max-width: 100%; padding: 0; }
            .search-box, .btn-print, #loading, #message-box { display: none !important; }
            .result-section { border-top: none; padding-top: 0; }
            .student-info { background: transparent; border: none; padding: 0; margin-bottom: 20px; }
            th { background-color: #f2f2f2 !important; color: #000 !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cek Nilai PP TKA-TKAD</h1>
        
        <!-- Kotak Pesan Error/Notifikasi Pengganti Alert -->
        <div id="message-box"></div>

        <!-- Kotak Pencarian -->
        <div class="search-box">
            <input type="text" id="nis" placeholder="Masukkan NIS Anda di sini..." onkeypress="handleEnter(event)">
            <button onclick="cariSiswa()">Cari Nilai</button>
        </div>
        
        <!-- Teks Loading -->
        <div id="loading">Mencari data ke Google Sheets... Mohon tunggu sebentar.</div>

        <!-- Area Hasil yang akan muncul setelah data ditemukan -->
        <div class="result-section" id="result-section">
            <h2>HASIL PP TKA-TKAD TAHAP 1 SLEMAN</h2>
            <h2>SMP MUHAMMADIYAH 2 DEPOK</h2>
            
            <!-- Struktur Identitas Siswa Dirapikan dengan CSS Grid -->
            <div class="student-info">
                <div class="label">Nama Lengkap</div><div class="colon">:</div><div class="value" id="nama-siswa">-</div>
                <div class="label">Nomor Induk Siswa</div><div class="colon">:</div><div class="value" id="nis-siswa">-</div>
                <div class="label">Kelas</div><div class="colon">:</div><div class="value" id="kelas-siswa">-</div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th width="10%">No</th>
                        <th style="text-align: left;" width="50%">Mata Pelajaran</th>
                        <th width="20%">Nilai</th>
                        <th width="20%">Peringkat Sekolah</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Baris nilai akan dimasukkan ke sini secara otomatis -->
                </tbody>
                <tfoot>
                    <tr style="background-color: #ecf0f1; font-weight: bold;">
                        <td colspan="2" style="text-align: right;">Rata-rata & Peringkat Total</td>
                        <td id="rata-rata">-</td>
                        <td id="peringkat-total">-</td>
                    </tr>
                </tfoot>
            </table>

            <!-- Tombol Cetak (Otomatis hilang saat di-PDF-kan) -->
            <button class="btn-print" onclick="window.print()">Unduh / Cetak Laporan Nilai PDF</button>
        </div>
    </div>

    <script>
        // GANTI URL DI BAWAH INI DENGAN URL WEB APP ANDA YANG BARU
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyEOyBd5OrHe0bKm6A0Mb74HIU31_-w5fIAyXwKrrxX2rcLGs4TSjG8-WG5mj1hTux0/exec';

        // Fungsi Menampilkan Pesan Khusus (Pengganti Alert)
        function showMessage(message, type = 'error') {
            const msgBox = document.getElementById('message-box');
            msgBox.textContent = message;
            msgBox.className = type === 'error' ? 'msg-error' : 'msg-warning';
            msgBox.style.display = 'block';
            
            // Sembunyikan otomatis setelah 5 detik
            setTimeout(() => {
                msgBox.style.display = 'none';
            }, 5000);
        }

        // Fungsi agar bisa klik 'Enter' di keyboard untuk mencari
        function handleEnter(event) {
            if (event.key === 'Enter') {
                cariSiswa();
            }
        }

        // Fungsi utama untuk mengambil data
        function cariSiswa() {
            const nisInput = document.getElementById('nis').value.trim();
            const resultSection = document.getElementById('result-section');
            const loadingText = document.getElementById('loading');
            
            // Cek apakah NIS kosong
            if (!nisInput) {
                showMessage('Silakan masukkan NIS terlebih dahulu.', 'warning');
                return;
            }

            // Sembunyikan hasil sebelumnya dan tampilkan tulisan loading
            resultSection.style.display = 'none';
            loadingText.style.display = 'block';
            document.getElementById('message-box').style.display = 'none'; // reset error
            
            // Menghubungi Google Sheets via URL API Anda
            fetch(`${SCRIPT_URL}?nis=${nisInput}`)
                .then(response => response.json())
                .then(res => {
                    loadingText.style.display = 'none'; // Sembunyikan loading setelah data tiba
                    
                    if (res.status === 'success') {
                        const siswa = res.data;
                        
                        // Isi data identitas ke HTML
                        document.getElementById('nama-siswa').textContent = siswa.nama;
                        document.getElementById('nis-siswa').textContent = siswa.nis;
                        document.getElementById('kelas-siswa').textContent = siswa.kelas;

                        // Bersihkan isi tabel sebelumnya
                        const tableBody = document.getElementById('table-body');
                        tableBody.innerHTML = '';

                        let totalNilai = 0;

                        // Mengurutkan urutan mata pelajaran sesuai permintaan
                        const urutanPelajaran = [
                            "Matematika",
                            "Bahasa Indonesia",
                            "Bahasa Inggris",
                            "Ilmu Pengetahuan Alam"
                        ];

                        siswa.nilai.sort((a, b) => {
                            let indexA = urutanPelajaran.indexOf(a.mataPelajaran);
                            let indexB = urutanPelajaran.indexOf(b.mataPelajaran);
                            
                            // Jika mata pelajaran tidak ada di daftar prioritas, taruh di akhir
                            if (indexA === -1) indexA = 999;
                            if (indexB === -1) indexB = 999;
                            
                            return indexA - indexB;
                        });

                        // Looping setiap mata pelajaran untuk dibuatkan baris tabel
                        siswa.nilai.forEach((item, index) => {
                            const row = document.createElement('tr');
                            
                            // Mengambil data peringkat per mata pelajaran jika ada, atau '-'
                            let peringkatSekolah = item.peringkatSekolah || '-';

                            row.innerHTML = `
                                <td>${index + 1}</td>
                                <td style="text-align: left;">${item.mataPelajaran}</td>
                                <td>${item.nilai}</td>
                                <td><strong style="color: #2c3e50;">${peringkatSekolah}</strong></td>
                            `;
                            tableBody.appendChild(row);
                            totalNilai += item.nilai; // Tambahkan ke total untuk dihitung rata-ratanya
                        });

                        // Hitung rata-rata
                        const rataRata = (totalNilai / siswa.nilai.length).toFixed(2);
                        document.getElementById('rata-rata').textContent = rataRata;

                        // Menangkap Peringkat Keseluruhan dari Google Script
                        let peringkatTotal = siswa.peringkatSekolahTotal || '-';
                        document.getElementById('peringkat-total').innerHTML = 
                            peringkatTotal !== '-' ? `<span style="color: #e67e22; font-size: 16px;">${peringkatTotal}</span>` : '-';

                        // Munculkan kembali tabel dan laporan
                        resultSection.style.display = 'block';
                    } else {
                        // Jika script merespon dengan status 'error' (NIS tidak ketemu)
                        showMessage(res.message || 'NIS tidak ditemukan di database.', 'error');
                    }
                })
                .catch(error => {
                    // Jika terjadi error pada jaringan internet atau konfigurasi URL
                    loadingText.style.display = 'none';
                    console.error('Error:', error);
                    showMessage('Terjadi kesalahan! Pastikan URL benar dan Deploy Google Script diset "Anyone".', 'error');
                });
        }
    </script>
</body>
</html>
