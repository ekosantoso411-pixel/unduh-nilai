<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Nilai Siswa</title>
    <style>
        /* Gaya Tampilan Dasar */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2, h3 { text-align: center; color: #2c3e50; }
        
        /* Area Pencarian */
        .search-box { display: flex; justify-content: center; margin-bottom: 20px; gap: 10px; }
        .search-box input { padding: 12px; font-size: 16px; border: 1px solid #ccd1d9; border-radius: 5px; width: 250px; outline: none; }
        .search-box input:focus { border-color: #3498db; }
        .search-box button { padding: 12px 25px; font-size: 16px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .search-box button:hover { background: #2980b9; }

        /* Status Loading */
        #loading { text-align: center; display: none; color: #e67e22; font-weight: bold; margin-bottom: 15px; font-size: 16px; }

        /* Area Hasil & Tabel */
        .result-section { display: none; margin-top: 30px; border-top: 2px dashed #ccd1d9; padding-top: 20px; }
        .student-info { margin-bottom: 20px; font-size: 16px; line-height: 1.6; }
        .student-info p { margin: 5px 0; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 25px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #2c3e50; color: white; text-transform: uppercase; font-size: 14px; }
        tbody tr:nth-child(even) { background-color: #f9f9f9; }
        
        /* Tombol Cetak */
        .btn-print { display: block; width: 100%; padding: 15px; background: #27ae60; color: white; text-align: center; font-size: 18px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .btn-print:hover { background: #2ecc71; }

        /* Pengaturan Khusus untuk PDF / Print */
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; max-width: 100%; padding: 0; }
            .search-box, .btn-print, #loading { display: none !important; }
            .result-section { border-top: none; padding-top: 0; }
            th { background-color: #f2f2f2 !important; color: #000 !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Portal Cek Nilai Siswa</h1>
        
        <!-- Kotak Pencarian -->
        <div class="search-box">
            <input type="text" id="nis" placeholder="Masukkan NIS Anda di sini..." onkeypress="handleEnter(event)">
            <button onclick="cariSiswa()">Cari Nilai</button>
        </div>
        
        <!-- Teks Loading -->
        <div id="loading">Mencari data ke Google Sheets... Mohon tunggu sebentar.</div>

        <!-- Area Hasil yang akan muncul setelah data ditemukan -->
        <div class="result-section" id="result-section">
            <h2>Laporan Hasil Belajar</h2>
            
            <div class="student-info">
                <p><strong>Nama Lengkap :</strong> <span id="nama-siswa">-</span></p>
                <p><strong>Nomor Induk Siswa :</strong> <span id="nis-siswa">-</span></p>
                <p><strong>Kelas :</strong> <span id="kelas-siswa">-</span></p>
            </div>

            <table>
                <thead>
                    <tr>
                        <th width="10%">No</th>
                        <th style="text-align: left;" width="50%">Mata Pelajaran</th>
                        <th width="20%">Nilai</th>
                        <th width="20%">Predikat</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Baris nilai akan dimasukkan ke sini secara otomatis -->
                </tbody>
                <tfoot>
                    <tr style="background-color: #ecf0f1; font-weight: bold;">
                        <td colspan="2" style="text-align: right;">Rata-rata</td>
                        <td id="rata-rata">-</td>
                        <td>-</td>
                    </tr>
                </tfoot>
            </table>

            <!-- Tombol Cetak (Otomatis hilang saat di-PDF-kan) -->
            <button class="btn-print" onclick="window.print()">Unduh / Cetak Laporan Nilai PDF</button>
        </div>
    </div>

    <script>
        // URL Google Apps Script yang Anda berikan
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyr3bkmYlWUiot6dlnNMYPlQKbRF8WvUHxiesUAdnwiVDx_oxDO9QS9lq-DWjcxiOu3/exec';

        // Fungsi agar bisa klik 'Enter' di keyboard untuk mencari
        function handleEnter(event) {
            if (event.key === 'Enter') {
                cariSiswa();
            }
        }

        // Fungsi utama untuk mengambil data
        function cariSiswa() {
            const nisInput = document.getElementById('nis').value.trim();
            const resultSection = document.getElementById('result-section');
            const loadingText = document.getElementById('loading');
            
            // Cek apakah NIS kosong
            if (!nisInput) {
                alert('Silakan masukkan NIS terlebih dahulu.');
                return;
            }

            // Sembunyikan hasil sebelumnya dan tampilkan tulisan loading
            resultSection.style.display = 'none';
            loadingText.style.display = 'block';
            
            // Menghubungi Google Sheets via URL API Anda
            fetch(`${SCRIPT_URL}?nis=${nisInput}`)
                .then(response => response.json())
                .then(res => {
                    loadingText.style.display = 'none'; // Sembunyikan loading setelah data tiba
                    
                    if (res.status === 'success') {
                        const siswa = res.data;
                        
                        // Isi data identitas ke HTML
                        document.getElementById('nama-siswa').textContent = siswa.nama;
                        document.getElementById('nis-siswa').textContent = siswa.nis;
                        document.getElementById('kelas-siswa').textContent = siswa.kelas;

                        // Bersihkan isi tabel sebelumnya
                        const tableBody = document.getElementById('table-body');
                        tableBody.innerHTML = '';

                        let totalNilai = 0;

                        // Looping setiap mata pelajaran untuk dibuatkan baris tabel
                        siswa.nilai.forEach((item, index) => {
                            const row = document.createElement('tr');
                            
                            // Logika Predikat Sederhana
                            let predikat = 'D';
                            if(item.nilai >= 90) predikat = 'A';
                            else if(item.nilai >= 80) predikat = 'B';
                            else if(item.nilai >= 70) predikat = 'C';

                            row.innerHTML = `
                                <td>${index + 1}</td>
                                <td style="text-align: left;">${item.mataPelajaran}</td>
                                <td>${item.nilai}</td>
                                <td><strong style="color: ${predikat === 'D' ? 'red' : 'black'};">${predikat}</strong></td>
                            `;
                            tableBody.appendChild(row);
                            totalNilai += item.nilai; // Tambahkan ke total untuk dihitung rata-ratanya
                        });

                        // Hitung rata-rata
                        const rataRata = (totalNilai / siswa.nilai.length).toFixed(2);
                        document.getElementById('rata-rata').textContent = rataRata;

                        // Munculkan kembali tabel dan laporan
                        resultSection.style.display = 'block';
                    } else {
                        // Jika script merespon dengan status 'error' (NIS tidak ketemu)
                        alert(res.message || 'NIS tidak ditemukan di database.');
                    }
                })
                .catch(error => {
                    // Jika terjadi error pada jaringan internet atau konfigurasi URL
                    loadingText.style.display = 'none';
                    console.error('Error:', error);
                    alert('Terjadi kesalahan saat mengambil data! Pastikan URL benar dan Deploy Google Script diset akses "Siapa saja" (Anyone).');
                });
        }
    </script>
</body>
</html>
